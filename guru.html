<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Data Guru</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
>

<style>
 
:root {
    --navy-950: #0b1526;
    --navy-900: #10203a;
    --navy-800: #16294a;
    --navy-700: #1e3a63;
    --blue-600: #2563eb;
    --blue-500: #3b82f6;
    --teal-500: #0d9488;
    --amber-500: #d97706;
    --slate-50: #f6f8fb;
    --slate-100: #eef1f6;
    --slate-200: #e2e7f0;
    --slate-400: #94a0b8;
    --slate-500: #6b7690;
    --slate-700: #384258;
    --slate-900: #1a2233;
    --danger: #dc3545;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --shadow-soft: 0 1px 2px rgba(16, 32, 58, .04), 0 12px 32px -12px rgba(16, 32, 58, .12);
    --shadow-hover: 0 4px 10px rgba(16, 32, 58, .06), 0 20px 40px -16px rgba(16, 32, 58, .18);
}
 
* {
    box-sizing: border-box;
}
 
body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(1100px 480px at 8% -8%, rgba(37, 99, 235, .10), transparent 60%),
        radial-gradient(900px 420px at 100% 0%, rgba(13, 148, 136, .08), transparent 55%),
        var(--slate-50);
    font-family: 'Manrope', Arial, sans-serif;
    color: var(--slate-900);
    -webkit-font-smoothing: antialiased;
}
 
.container-page {
    padding: 40px clamp(16px, 4vw, 48px);
    max-width: 1280px;
    margin: 0 auto;
}
 
/* ---------- Header ---------- */
 
.header-card {
    position: relative;
    background: linear-gradient(135deg, var(--navy-950) 0%, var(--navy-800) 55%, var(--navy-700) 100%);
    border-radius: var(--radius-lg);
    padding: 34px 36px;
    margin-bottom: 28px;
    box-shadow: 0 20px 45px -18px rgba(11, 21, 38, .55);
    overflow: hidden;
    isolation: isolate;
}
 
.header-card::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background-image:
        radial-gradient(420px 220px at 92% 15%, rgba(59, 130, 246, .35), transparent 70%),
        radial-gradient(300px 200px at 78% 110%, rgba(13, 148, 136, .30), transparent 70%);
}
 
.header-card::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    opacity: .5;
    background-image:
        linear-gradient(rgba(255, 255, 255, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .045) 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: linear-gradient(180deg, black, transparent 85%);
}
 
.header-title {
    font-family: 'Plus Jakarta Sans', Arial, sans-serif;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -.02em;
    margin: 0;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 12px;
}
 
.header-title i {
    width: 46px;
    height: 46px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    border-radius: 13px;
    color: #fff;
    background: linear-gradient(135deg, var(--blue-500), var(--teal-500));
    box-shadow: 0 8px 18px -6px rgba(59, 130, 246, .55);
}
 
.header-subtitle {
    color: #aebada;
    margin-top: 6px;
    font-size: 14.5px;
    font-weight: 500;
    letter-spacing: .01em;
}
 
.btn-primary {
    background: linear-gradient(135deg, var(--blue-500), var(--blue-600));
    border: none;
    font-weight: 700;
    font-family: 'Plus Jakarta Sans', Arial, sans-serif;
    letter-spacing: .01em;
    padding: 11px 22px;
    border-radius: 12px;
    box-shadow: 0 10px 22px -8px rgba(37, 99, 235, .55);
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
}
 
.btn-primary:hover,
.btn-primary:focus {
    background: linear-gradient(135deg, var(--blue-500), var(--blue-600));
    transform: translateY(-1px);
    box-shadow: 0 14px 28px -8px rgba(37, 99, 235, .6);
    filter: brightness(1.04);
}
 
.btn-primary:active {
    transform: translateY(0);
}
 
.btn-primary i {
    margin-right: 6px;
}
 
/* ---------- Data card ---------- */
 
.data-card {
    background: #ffffff;
    border: 1px solid var(--slate-200);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-soft);
}
 
.data-header {
    padding: 22px 28px;
    border-bottom: 1px solid var(--slate-100);
    background: linear-gradient(180deg, #fbfcfe, #ffffff);
}
 
.data-header strong {
    font-family: 'Plus Jakarta Sans', Arial, sans-serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--slate-900);
    letter-spacing: -.01em;
}
 
#guruCount {
    font-size: 13px;
    font-weight: 600;
    color: var(--slate-500);
    margin-top: 3px;
}
 
.btn-outline-secondary {
    border: 1px solid var(--slate-200);
    color: var(--slate-700);
    font-weight: 600;
    font-size: 13.5px;
    border-radius: 10px;
    padding: 8px 16px;
    background: #fff;
    transition: all .15s ease;
}
 
.btn-outline-secondary:hover {
    background: var(--slate-50);
    border-color: var(--blue-500);
    color: var(--blue-600);
}
 
.btn-outline-secondary i {
    margin-right: 5px;
}
 
/* ---------- Table ---------- */
 
.table-responsive {
    padding: 0;
}
 
.table {
    margin-bottom: 0;
    font-size: 14.5px;
}
 
.table thead th {
    background: var(--slate-50);
    color: var(--slate-500);
    font-family: 'Plus Jakarta Sans', Arial, sans-serif;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    padding: 10px 15px;
    white-space: nowrap;
    border-bottom: 1px solid var(--slate-200);
}
 
.table tbody td {
    padding: 8px 10px;
    vertical-align: middle;
    color: var(--slate-700);
    border-bottom: 1px solid var(--slate-100);
}
 
.table tbody tr {
    transition: background-color .12s ease;
}
 
.table tbody tr:hover {
    background-color: #f5f8ff;
}
 
.table tbody tr:last-child td {
    border-bottom: none;
}
 
.action-btn {
    margin: 2px;
    border-radius: 8px;
    font-weight: 600;
}
 
.loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--slate-500);
}
 
.loading .spinner-border {
    color: var(--blue-500) !important;
    width: 2.4rem;
    height: 2.4rem;
}
 
.badge {
    font-weight: 600;
    letter-spacing: .01em;
    border-radius: 999px;
    padding: 5px 11px;
}
 
/* ---------- Modal ---------- */
 
.modal-content {
    border: none;
    border-radius: var(--radius-md);
    box-shadow: 0 30px 70px -20px rgba(11, 21, 38, .35);
    overflow: hidden;
}
 
.modal-header {
    background: linear-gradient(135deg, var(--navy-950), var(--navy-700));
    border-bottom: none;
    padding: 20px 26px;
}
 
.modal-title {
    font-family: 'Plus Jakarta Sans', Arial, sans-serif;
    font-weight: 700;
    color: #fff;
    font-size: 17px;
}
 
.modal-header .btn-close {
    filter: invert(1) grayscale(1) brightness(1.6);
    opacity: .85;
}
 
.modal-header .btn-close:hover {
    opacity: 1;
}
 
.modal-body {
    padding: 26px;
}
 
.form-label {
    font-weight: 700;
    font-size: 13px;
    color: var(--slate-700);
    letter-spacing: .01em;
    margin-bottom: 6px;
}
 
.form-control {
    border: 1.5px solid var(--slate-200);
    border-radius: 10px;
    padding: 10px 13px;
    font-size: 14.5px;
    color: var(--slate-900);
    transition: border-color .15s ease, box-shadow .15s ease;
}
 
.form-control:focus {
    border-color: var(--blue-500);
    box-shadow: 0 0 0 4px rgba(59, 130, 246, .12);
}
 
.modal-footer {
    border-top: 1px solid var(--slate-100);
    padding: 16px 26px;
    background: var(--slate-50);
}
 
.modal-footer .btn-secondary {
    background: #fff;
    border: 1.5px solid var(--slate-200);
    color: var(--slate-700);
    font-weight: 600;
    border-radius: 10px;
    padding: 9px 18px;
}
 
.modal-footer .btn-secondary:hover {
    background: var(--slate-100);
}
 
.modal-footer .btn-primary {
    padding: 9px 20px;
}
 
/* ---------- Responsive ---------- */
 
@media (max-width: 576px) {
    .container-page {
        padding: 20px 14px;
    }
 
    .header-card {
        padding: 24px 20px;
    }
 
    .header-title {
        font-size: 23px;
    }
 
    .data-header {
        flex-direction: column;
        align-items: flex-start !important;
        gap: 12px;
    }
}
 
</style>

</head>


<body>


<div class="container-page">


<div class="header-card">

<div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

<div>

<h1 class="header-title">
<i class="bi bi-person-workspace"></i>
Data Guru
</h1>

<div class="header-subtitle">
Kelola data guru SMK Teuku Umar Semarang
</div>

</div>


<button
    class="btn btn-primary"
    onclick="openAddGuru()"
>

<i class="bi bi-person-plus"></i>
Tambah Guru

</button>

</div>

</div>



<div class="data-card">


<div class="data-header d-flex justify-content-between align-items-center">

<div>

<strong>Daftar Guru</strong>

<div
    id="guruCount"
    class="text-muted small"
>
Memuat...
</div>

</div>


<button
    class="btn btn-outline-secondary btn-sm"
    onclick="loadGuru()"
>

<i class="bi bi-arrow-clockwise"></i>

Refresh

</button>

</div>



<div class="table-responsive">

<table class="table table-hover">

<thead>

<tr>

<th>No</th>
<th>ID</th>
<th>NIP</th>
<th>Nama</th>
<th>Jabatan</th>
<th>No HP</th>
<th>Face</th>
<th>Aksi</th>

</tr>

</thead>


<tbody id="guruTableBody">

<tr>

<td
    colspan="8"
    class="loading"
>

<div class="spinner-border text-primary"></div>

<div class="mt-2">
Memuat data guru...
</div>

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>



<!-- MODAL -->

<div
    class="modal fade"
    id="guruModal"
    tabindex="-1"
>

<div class="modal-dialog modal-dialog-centered">

<div class="modal-content">

<div class="modal-header">

<h5
    class="modal-title"
    id="guruModalTitle"
>
Tambah Guru
</h5>

<button
    type="button"
    class="btn-close"
    data-bs-dismiss="modal"
></button>

</div>


<div class="modal-body">

<input
    type="hidden"
    id="guruId"
>


<div class="mb-3">

<label class="form-label">
NIP
</label>

<input
    id="guruNip"
    class="form-control"
>

</div>


<div class="mb-3">

<label class="form-label">
Nama
</label>

<input
    id="guruNama"
    class="form-control"
>

</div>


<div class="mb-3">

<label class="form-label">
Jabatan
</label>

<input
    id="guruJabatan"
    class="form-control"
>

</div>


<div class="mb-3">

<label class="form-label">
No HP
</label>

<input
    id="guruNoHp"
    class="form-control"
>

</div>

</div>


<div class="modal-footer">

<button
    class="btn btn-secondary"
    data-bs-dismiss="modal"
>
Batal
</button>

<button
    class="btn btn-primary"
    onclick="saveGuru()"
>

<i class="bi bi-save"></i>
Simpan

</button>

</div>

</div>

</div>

</div>



<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="auth.js"></script>
<script src="guru.js"></script>

</body>

</html>

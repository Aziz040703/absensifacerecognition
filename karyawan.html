<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Data Karyawan</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
>

<style>

@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

:root {
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --bg-main: #f8fafc;
  --card-bg: #ffffff;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --border-color: #e2e8f0;
}

body {
  margin: 0;
  background-color: var(--bg-main);
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--text-main);
  -webkit-font-smoothing: antialiased;
}

.container-page {
  padding: 35px 20px;
  max-width: 1240px;
  margin: 0 auto;
}

/* Card Wrapper */
.header-card,
.data-card {
  background: var(--card-bg);
  border-radius: 20px;
  border: 1px solid var(--border-color);
  box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.03);
}

.header-card {
  padding: 28px 32px;
  margin-bottom: 24px;
}

.header-title {
  font-size: 1.65rem;
  font-weight: 700;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 10px;
}

.header-title i {
  color: var(--primary);
}

.header-subtitle {
  color: var(--text-muted);
  font-size: 0.925rem;
  margin-top: 4px;
}

.data-card {
  overflow: hidden;
}

.data-header {
  padding: 20px 28px;
  background: var(--card-bg);
  border-bottom: 1px solid var(--border-color);
  align-items: center;
}

.data-header strong {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-main);
}

#karyawanCount {
  color: var(--text-muted) !important;
  font-size: 0.85rem;
  margin-top: 2px;
}

/* Tabel Modern */
.table {
  margin-bottom: 0;
}

.table th {
  background: #f8fafc;
  color: var(--text-muted);
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-color);
  white-space: nowrap;
}

.table td {
  padding: 16px 20px;
  vertical-align: middle;
  color: var(--text-main);
  border-bottom: 1px solid #f1f5f9;
  font-size: 0.9rem;
}

.table-hover tbody tr {
  transition: background-color 0.2s ease;
}

.table-hover tbody tr:hover {
  background-color: #f8fafc;
}

/* Foto Profil & Avatar */
.photo-thumb {
  width: 44px;
  height: 44px;
  object-fit: cover;
  border-radius: 50%;
  border: 2px solid #ffffff;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
  transition: transform 0.2s ease;
}

.photo-thumb:hover {
  transform: scale(1.08);
}

/* Badge Custom Override (Gaya Soft Pill) */
.badge {
  padding: 6px 12px;
  border-radius: 30px;
  font-weight: 600;
  font-size: 0.775rem;
  letter-spacing: 0.2px;
}

.badge.bg-success {
  background-color: #dcfce7 !important;
  color: #15803d !important;
}

.badge.bg-secondary {
  background-color: #f1f5f9 !important;
  color: #64748b !important;
}

/* Tombol Aksi & Navigasi */
.btn {
  border-radius: 10px;
  font-weight: 600;
  font-size: 0.875rem;
  padding: 9px 18px;
  transition: all 0.2s ease;
}

.btn-sm {
  padding: 6px 12px;
  font-size: 0.8rem;
  border-radius: 8px;
}

.btn-primary {
  background-color: var(--primary);
  border-color: var(--primary);
  box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
}

.btn-primary:hover, .btn-primary:focus {
  background-color: var(--primary-hover);
  border-color: var(--primary-hover);
  transform: translateY(-1px);
}

.btn-warning {
  background-color: #fef3c7;
  border-color: transparent;
  color: #b45309;
}

.btn-warning:hover {
  background-color: #fde68a;
  color: #92400e;
}

.btn-danger {
  background-color: #fee2e2;
  border-color: transparent;
  color: #b91c1c;
}

.btn-danger:hover {
  background-color: #fca5a5;
  color: #991b1b;
}

.btn-success {
  background-color: #e0e7ff;
  border-color: transparent;
  color: #4338ca;
}

.btn-success:hover {
  background-color: #c7d2fe;
  color: #3730a3;
}

.btn-outline-secondary {
  border-color: var(--border-color);
  color: var(--text-muted);
  background-color: #ffffff;
}

.btn-outline-secondary:hover {
  background-color: #f1f5f9;
  border-color: var(--border-color);
  color: var(--text-main);
}

/* Modal Form Modern */
.modal-content {
  border-radius: 20px;
  border: none;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
  overflow: hidden;
}

.modal-header {
  background: #f8fafc;
  border-bottom: 1px solid var(--border-color);
  padding: 20px 28px;
}

.modal-title {
  font-weight: 700;
  color: var(--text-main);
  font-size: 1.15rem;
}

.modal-body {
  padding: 28px;
}

.modal-footer {
  border-top: 1px solid var(--border-color);
  padding: 16px 28px;
  background: #f8fafc;
}

.form-label {
  font-weight: 600;
  font-size: 0.85rem;
  color: var(--text-main);
  margin-bottom: 6px;
}

.form-control, .form-select {
  border-radius: 10px;
  border: 1px solid var(--border-color);
  padding: 10px 14px;
  font-size: 0.9rem;
  transition: all 0.2s ease;
}

.form-control:focus, .form-select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
}

</style>

</head>


<body>


<div class="container-page">


<div class="header-card">

<div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

<div>

<div class="header-title">

<i class="bi bi-people"></i>
Data Karyawan

</div>

<div class="header-subtitle">
Kelola data karyawan SMK Teuku Umar Semarang
</div>

</div>


<button
    class="btn btn-primary"
    onclick="openAddKaryawan()"
>

<i class="bi bi-person-plus"></i>
Tambah Karyawan

</button>

</div>

</div>



<div class="data-card">


<div class="data-header d-flex justify-content-between">

<div>

<strong>Daftar Karyawan</strong>

<div
    id="karyawanCount"
    class="text-muted small"
>
Memuat...
</div>

</div>


<button
    class="btn btn-outline-secondary btn-sm"
    onclick="loadKaryawan()"
>

<i class="bi bi-arrow-clockwise"></i>
Refresh

</button>

</div>


<div class="table-responsive">

<table class="table table-hover">

<thead>

<tr>

<th>No</th>
<th>ID</th>
<th>NIP</th>
<th>Nama</th>
<th>Divisi</th>
<th>Foto</th>
<th>Status</th>
<th>Face</th>
<th>Aksi</th>

</tr>

</thead>


<tbody id="karyawanTableBody">

<tr>

<td
    colspan="9"
    class="text-center py-5"
>

<div class="spinner-border text-primary"></div>

<div class="mt-2">
Memuat data karyawan...
</div>

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>



<!-- MODAL -->

<div
    class="modal fade"
    id="karyawanModal"
    tabindex="-1"
>

<div class="modal-dialog modal-dialog-centered">

<div class="modal-content">

<div class="modal-header">

<h5
    class="modal-title"
    id="karyawanModalTitle"
>
Tambah Karyawan
</h5>

<button
    class="btn-close"
    data-bs-dismiss="modal"
></button>

</div>


<div class="modal-body">

<input
    type="hidden"
    id="karyawanId"
>


<div class="mb-3">

<label class="form-label">
NIP
</label>

<input
    id="karyawanNip"
    class="form-control"
>

</div>


<div class="mb-3">

<label class="form-label">
Nama
</label>

<input
    id="karyawanNama"
    class="form-control"
>

</div>


<div class="mb-3">

<label class="form-label">
Divisi
</label>

<input
    id="karyawanDivisi"
    class="form-control"
>

</div>


<div class="mb-3">

<label class="form-label">
Foto
</label>

<input
    id="karyawanFoto"
    class="form-control"
    placeholder="URL foto"
>

</div>


<div class="mb-3">

<label class="form-label">
Status
</label>

<select
    id="karyawanStatus"
    class="form-select"
>

<option value="Aktif">
Aktif
</option>

<option value="Nonaktif">
Nonaktif
</option>

</select>

</div>

</div>


<div class="modal-footer">

<button
    class="btn btn-secondary"
    data-bs-dismiss="modal"
>
Batal
</button>

<button
    class="btn btn-primary"
    onclick="saveKaryawan()"
>

<i class="bi bi-save"></i>
Simpan

</button>

</div>

</div>

</div>

</div>



<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="auth.js"></script>
<script src="karyawan.js"></script>

</body>

</html>
